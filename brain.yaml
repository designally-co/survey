# Spec: https://github.com/designally-co/designally-brain/blob/main/docs/brain-yaml.md

format_version: 1
slug: survey
name: Survey (Designally Platform)
kind: internal_tool
status: live

purpose: >
  Replaces the manual work between a signed deal and the start of the work.
  Clients answer a branded bilingual questionnaire, and the platform turns the
  answers into one page that says what the client has settled, where people
  contradict themselves or each other, and what is still undecided.
summary: >
  One Next.js app with two surfaces. The public survey (/s/<token>) needs no
  login, works on a phone and in Thai, shows two to four questions per screen,
  and saves the client's progress as they type. The team app is behind Google
  sign-in for designally.co accounts, in English, and lists every live client
  project. A client buys one of two packages, Brand or Design, each with a
  fixed, versioned questionnaire. When collection closes (by a person or when
  the survey's date passes), the analysis writes the insights with Claude. The
  platform's job ends at the insights. Sending the link is manual; the platform
  never emails anyone.

stack:
  - Next.js
  - Drizzle ORM
  - PostgreSQL (Supabase)
  - Auth.js (Google sign-in)
  - Claude API
  - Tailwind CSS
  - Docker (Designally NAS)
  - Cloudflare Workers

live_url: https://survey.designally.co
repo_url: https://github.com/designally-co/survey
supabase_project_ref: urzwmhoujpphumruhgkv

features:
  - name: Client questionnaire
    description: >
      Public bilingual survey at /s/<token>. No login. Two to four questions
      per screen, grouped by subject. Progress is saved as the client types,
      per device. One link can be shared with several people at the client.
  - name: Two packages
    description: >
      Brand (Brand Strategy and Brand Identity) or Design, never both. The
      questions live in a seed file, are versioned, and a sent survey keeps the
      version it was sent with.
  - name: Projects list
    description: >
      The team app's home: every client project, whether it is collecting
      answers or has insights. Shows "3 answers so far", never an expected
      count.
  - name: Survey link and QR code
    description: The team copies the survey link or shows it as a QR code. Sending it is manual.
  - name: Collection date and closing
    description: >
      Every survey has a date to answer by, prefilled at 14 days. The link
      stops taking answers when a person presses Close now or the date passes.
      Reopening needs a new date. Who closed it and when is recorded.
  - name: Insights
    description: >
      Claude reads the answers and writes the insights: conflicts, clarity
      gaps and flags. Never percentages or sentiment scores. Every run is kept
      as a version, and it can be written again on chosen answers. The
      client's email is never sent to the analysis.
  - name: Automatic analysis after the date
    description: >
      Once a day, surveys past their date with answers and no analysis get one
      written automatically.
  - name: Archive project
    description: A person archives a finished project by hand. Archiving an open survey closes collection first.
  - name: Google sign-in
    description: Sign-in with Google, limited to designally.co accounts. No other sign-in method.

