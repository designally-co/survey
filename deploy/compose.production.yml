# The Survey platform on the Designally NAS — the Portainer stack.
#
# Nothing in this file is a secret, and nothing secret may be added to it.
# Every ${NAME} is a Portainer stack environment variable, entered there;
# docs/deploy-nas.md says what each one is. `:?` means the stack refuses to
# start without it, rather than starting a container that fails later.
#
# IMAGE_TAG is `sha-<full 40-character commit>`, copied from the release
# workflow's run summary. There is no default and never `latest`.
services:
  app:
    image: ghcr.io/designally-co/designally-platform:${IMAGE_TAG:?set IMAGE_TAG to sha-<full commit>}
    container_name: survey
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000

      # BOTH of these, and both the public origin. Behind Caddy the standalone
      # server reports itself as 0.0.0.0:3000: AUTH_URL keeps Google sign-in
      # returning to the right place, and SURVEY_ORIGIN keeps the links handed
      # to clients pointing at the real site. Neither is a secret.
      #
      # THE NEW NAME. Links already sent to clients say s.designally.co, and
      # Caddy keeps answering there and sends them here (docs/deploy-nas.md).
      # Only links made from now on carry this name.
      AUTH_URL: https://survey.designally.co
      SURVEY_ORIGIN: https://survey.designally.co

      # Neon, pooled connection string.
      DATABASE_URL: ${DATABASE_URL:?}

      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}

      # The lapsed-survey endpoint refuses to run without it.
      CRON_SECRET: ${CRON_SECRET:?}
    # No published ports: Caddy reaches survey:3000 on caddy_default.
    networks:
      - caddy_default
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  caddy_default:
    external: true
